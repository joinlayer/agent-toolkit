name: Public contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp-gateway/requirements.lock
      - name: Install locked dependencies
        run: pip install --requirement mcp-gateway/requirements.lock --requirement requirements-ci.lock
      - name: Validate public snapshot
        run: python scripts/validate_public_snapshot.py
      - name: Validate prompts and use cases
        run: python scripts/validate_content.py
      - name: Scan committed tree for secrets
        run: python scripts/check_secret_scan.py
      - name: Validate MCP Registry metadata
        run: python scripts/validate_server_json.py
      - name: Run gateway contracts
        run: python scripts/run_gateway_contracts.py
      - name: Compile gateway
        run: python -m compileall -q mcp-gateway/joinlayer_mcp
      - name: Record synchronized source digest
        run: python scripts/source_tree_digest.py
      - name: Verify synchronized source boundary
        run: python -m unittest scripts.test_source_tree_digest -v
      - name: Build review container
        run: docker build --tag joinlayer-agent-toolkit:ci .
